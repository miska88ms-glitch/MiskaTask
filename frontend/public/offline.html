<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F6">
  <title>Sei offline · Family Task</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 32px; background: #FFF9F6; color: #2C2A28; font: 17px/1.6 system-ui, sans-serif; text-align: center; }
    main { max-width: 400px; } img { border-radius: 24px; } h1 { font-size: 30px; line-height: 1.2; } p { color: #7A736E; }
    button { border: 0; border-radius: 40px; min-height: 52px; width: 100%; padding: 16px 24px; background: #FF6B6B; color: white; font: 700 17px system-ui, sans-serif; cursor: pointer; }
    button:active { opacity: .8; }
  </style>
</head>
<body>
  <main data-testid="offline-page">
    <img src="/icons/icon-192.png" width="88" height="88" alt="Family Task">
    <h1 data-testid="offline-title">Ci ritroviamo online</h1>
    <p data-testid="offline-description">Family Task ha bisogno di una connessione per mostrare e sincronizzare compiti, calendario e messaggi della tua famiglia.</p>
    <p>Le modifiche non vengono salvate offline.</p>
    <button id="retry" data-testid="offline-retry-button" type="button">Riprova</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { window.location.reload(); });
    window.addEventListener('online', function () { window.location.reload(); });
  </script>
</body>
</html>
