<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Family Task</title>
    <meta name="description" content="Compiti, calendario, chat e premi per tutta la famiglia." />
    <meta name="theme-color" content="#FFF9F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Family Task" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <style>
      html, body { height: 100%; margin: 0; background: #FFF9F6; overscroll-behavior: none; }
      body { overflow: hidden; display: flex; flex-direction: column; }
      #root { display: flex; flex: 1; height: 100%; position: fixed; inset: 0; }
      [role="tablist"] [role="tab"] * { overflow: visible !important; }
      [role="heading"], [role="heading"] * { overflow: visible !important; }
    </style>
  </head>
  <body>
    <noscript>Attiva JavaScript nel browser per usare Family Task.</noscript>
    <div id="root"></div>
  </body>
</html>
